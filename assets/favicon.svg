<!-- The brand mark from Wordmark.tsx, as the tab icon: the same dark tile,
     green border and terminal prompt, so the pinned tab reads as the same
     product as the sidebar. Sized to stay legible at 16px: the tile fills
     the viewBox and the glyph strokes are proportionally heavier than the
     in-app mark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a1c"/>
      <stop offset="1" stop-color="#071b12"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)" stroke="#00d26a" stroke-width="2"/>
  <path d="M9 11 L15 16 L9 21" stroke="#00d26a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="17.5" y1="21" x2="24" y2="21" stroke="#00d26a" stroke-width="2.6" stroke-linecap="round"/>
</svg>
